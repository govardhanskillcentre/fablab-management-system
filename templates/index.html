<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FabLab Management System — Login</title><link rel="stylesheet" href="/static/style.css"><style>
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#082f5b 0%,#1268ad 55%,#eaf5ff 100%)}
.login-card{width:min(430px,100%);background:#fff;border:1px solid rgba(255,255,255,.55);border-radius:20px;padding:34px;box-shadow:0 24px 70px rgba(2,27,54,.28)}
.login-brand{text-align:center;margin-bottom:26px}.login-logo{width:64px;height:64px;border-radius:16px;background:#0b4a83;color:#fff;display:grid;place-items:center;margin:0 auto 14px;font-size:23px;font-weight:900}.login-brand h1{margin:0;color:#0b3157;font-size:25px}.login-brand p{margin:6px 0 0;color:#718096;font-size:13px}
.login-form{display:flex;flex-direction:column;gap:9px;margin:0;padding:0;background:transparent;border:0;box-shadow:none}.login-form label{font-size:12px;font-weight:800;color:#405268;margin-top:5px}.login-form input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #cbd5df;border-radius:9px;background:#fff;font:inherit;min-height:46px;outline:none}.login-form input:focus{border-color:#3f91cc;box-shadow:0 0 0 3px #3f91cc20}.password-wrap{display:flex;gap:8px}.password-wrap input{flex:1}.password-toggle{border:1px solid #cbd5df;background:#f5f8fb;color:#285477;border-radius:9px;padding:0 13px;font-weight:800;cursor:pointer}.login-btn{width:100%;min-height:48px;border:0;border-radius:9px;background:#1268ad;color:#fff;font-size:14px;font-weight:850;cursor:pointer;margin-top:9px}.login-btn:hover{background:#084b80}.login-error{display:none;padding:10px 12px;background:#fff1f0;border:1px solid #f3c7c3;color:#b42318;border-radius:8px;font-size:12px;font-weight:700}.login-help{text-align:center;margin:17px 0 0;color:#8795a6;font-size:11px}.login-loading{text-align:center;color:#64748b;font-size:12px;margin-top:10px;display:none}
@media(max-width:540px){.login-page{padding:14px}.login-card{padding:26px 20px;border-radius:16px}.login-brand h1{font-size:22px}.password-wrap{gap:6px}.password-toggle{padding:0 10px}}
</style></head><body><div class="login-page"><div class="login-card"><div class="login-brand"><div class="login-logo">FL</div><h1>FabLab Management System</h1><p>Secure sign in to continue</p></div><form id="loginForm" class="login-form"><label for="loginEmail">Email</label><input id="loginEmail" type="email" placeholder="Enter your Firebase email" autocomplete="username" required><label for="loginPassword">Password</label><div class="password-wrap"><input id="loginPassword" type="password" placeholder="Enter your password" autocomplete="current-password" required><button id="togglePassword" class="password-toggle" type="button">Show</button></div><div id="loginError" class="login-error"></div><button id="loginButton" class="login-btn" type="submit">Login</button><div id="loginLoading" class="login-loading">Signing in…</div></form><p class="login-help">User accounts are managed from Firebase Authentication.</p></div></div><script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDGQ93ptLXzlIo1Hjddq8zhrLzWQeqnRXY",
  authDomain: "fablab-database.firebaseapp.com",
  projectId: "fablab-database",
  storageBucket: "fablab-database.firebasestorage.app",
  messagingSenderId: "814169448883",
  appId: "1:814169448883:web:4f6f1c9b2d838b9bc7ebc6",
  measurementId: "G-9DPK9W1LWV"
};
firebase.initializeApp(firebaseConfig);
</script><script>
const auth=firebase.auth();const form=document.getElementById('loginForm');const email=document.getElementById('loginEmail');const password=document.getElementById('loginPassword');const errorBox=document.getElementById('loginError');const button=document.getElementById('loginButton');const loading=document.getElementById('loginLoading');
auth.onAuthStateChanged(function(user){if(user) window.location.replace('/dashboard');});
form.addEventListener('submit',async function(e){e.preventDefault();errorBox.style.display='none';loading.style.display='block';button.disabled=true;try{await auth.signInWithEmailAndPassword(email.value.trim(),password.value);password.value='';window.location.replace('/dashboard');}catch(err){console.error(err);errorBox.textContent='Invalid email or password.';errorBox.style.display='block';}finally{loading.style.display='none';button.disabled=false;}});
document.getElementById('togglePassword').addEventListener('click',function(){password.type=password.type==='password'?'text':'password';this.textContent=password.type==='password'?'Show':'Hide';});
</script></body></html>
